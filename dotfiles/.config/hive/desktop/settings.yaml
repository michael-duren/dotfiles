version: 7
polling:
    interval: 5m0s
updates:
    enabled: true
notifications:
    enabled: true
    delivery: auto
    sound: true
appearance:
    theme: one-dark
    terminal_scale: 108
    terminal_show_windows: true
    terminal_show_status_bar: true
    terminal_pool_size: 3
    terminal_show_session_age: true
    terminal_session_age_threshold_days: 5
http:
    enabled: true
    host: 127.0.0.1
    port: 34857
telemetry:
    enabled: false
hive_cli:
    install_command: true
agent_workspaces:
    session_end_delay: 10s
onboarding:
    completed: true
development:
    mocks:
        mode: live
    vite:
        host: 127.0.0.1
        port: 0
    wails:
        host: 127.0.0.1
        port: 0
    pprof:
        enabled: false
    perf:
        enabled: false
    metrics:
        enabled: false
    devtools:
        enabled: false
    debug:
        pause_ingest: 0s
        pause_commit: 0s
