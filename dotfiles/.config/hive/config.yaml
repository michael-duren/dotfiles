# ~/.config/hive/config.yaml
repo_dirs:
  - ~/Code/my-apps/
  - ~/Code/oss/
  - ~/Code/
  - ~/Code/cia
agents:
  agent_selector: true
  default: claude
  neovim:
    command: nvim
  claude:
    command: claude
    flags: ["--dangerously-skip-permissions"]
  codex:
    command: codex
    flags: ["--dangerously-bypass-approvals-and-sandbox"]
rules:
  - pattern: ""
    clone_strategy: worktree
    branch_template: "{{ .Slug }}"
