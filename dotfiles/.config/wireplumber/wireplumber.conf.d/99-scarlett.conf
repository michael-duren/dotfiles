monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_.*usb-Focusrite_Scarlett_Solo_4th_Gen.*" }
      { node.name = "~alsa_input.hw_Gen_0" }
    ]
    actions = {
      update-props = {
        # Extra slack between the USB device clock and the graph wakeup.
        api.alsa.headroom = 1024
        # Keep ALSA batch detection enabled for USB hardware timing.
        # Never suspend/resume the PCM. Resume is where the glitches land.
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
